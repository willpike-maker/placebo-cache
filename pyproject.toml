[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "placebo-cache"
version = "0.1.0"
description = "High-performance zero-RAM distributed cache delivering provably plausible synthetic hits and KPI-compliant hit ratios."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Will Pike", email = "willpike@example.com"}
]
keywords = ["cache", "zero-ram", "distributed-systems", "kpi-optimization", "placebo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Distributed Computing",
]

[project.scripts]
placebo-cache = "placebo_cache.cli:main"
